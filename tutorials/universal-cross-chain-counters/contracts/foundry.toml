[profile.default]
solc_version = "0.8.26"

# Push Chain Donut Testnet's EVM does not support Cancun opcodes (MCOPY = 0x5e
# would revert at runtime). Compile for Shanghai instead — Sepolia / BNB / Base
# all support Shanghai too, so the same artifact deploys on every chain in the
# tutorial.
evm_version = "shanghai"

src = "src"
out = "out"
libs = ["lib"]

[rpc_endpoints]
push_testnet     = "https://evm.donut.rpc.push.org/"
sepolia          = "https://ethereum-sepolia-rpc.publicnode.com"
bsc_testnet      = "https://bsc-testnet-rpc.publicnode.com"
base_sepolia     = "https://sepolia.base.org"
arbitrum_sepolia = "https://sepolia-rollup.arbitrum.io/rpc"

# BlockScout doesn't require an API key but Foundry expects a key field.
[etherscan]
push_testnet     = { key = "blockscout", url = "https://donut.push.network/api", chain = 42101 }
sepolia          = { key = "verifykey", url = "https://api-sepolia.etherscan.io/api", chain = 11155111 }
bsc_testnet      = { key = "verifykey", url = "https://api-testnet.bscscan.com/api", chain = 97 }
arbitrum_sepolia = { key = "verifykey", url = "https://api-sepolia.arbiscan.io/api", chain = 421614 }
